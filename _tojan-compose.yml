services:
  tojan:
    image: nginx:alpine
    container_name: tojan
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # HTTPS router — apex + www
      - "traefik.http.routers.tojan.rule=Host(`rshad.net`) || Host(`www.rshad.net`)"
      - "traefik.http.routers.tojan.entrypoints=websecure"
      - "traefik.http.routers.tojan.tls=true"
      - "traefik.http.routers.tojan.tls.certresolver=letsencrypt"
      - "traefik.http.services.tojan.loadbalancer.server.port=80"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.tojan-http.rule=Host(`rshad.net`) || Host(`www.rshad.net`)"
      - "traefik.http.routers.tojan-http.entrypoints=web"
      - "traefik.http.routers.tojan-http.middlewares=tojan-redirect@docker"
      - "traefik.http.middlewares.tojan-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tojan-redirect.redirectscheme.permanent=true"

networks:
  traefik:
    external: true
